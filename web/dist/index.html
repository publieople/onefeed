<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让安全区变量在 iPhone 上生效，底部 AI 唤起器才不会压在手势条上 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfbf7" />
    <meta
      name="description"
      content="OneFeed 把 B 站、小红书、抖音、掘金、V2EX、知乎、知乎热榜收进一屏，能按平台筛、按时间筛，还能让 AI 帮你挑和总结。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141619'/%3E%3Ccircle cx='32' cy='32' r='12' fill='none' stroke='%23ffffff' stroke-width='6'/%3E%3C/svg%3E"
    />
    <title>OneFeed · 一屏刷完七个平台</title>
    <script>
      // 先上色再渲染，避免刷新时先白一下再变暗
      try {
        var t = localStorage.getItem("onefeed.theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/assets/index-IMhaAnUX.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CIgUn_3P.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
