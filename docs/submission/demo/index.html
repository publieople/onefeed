<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23141414'/%3E%3Ctext x='16' y='22' font-size='18' fill='white' text-anchor='middle' font-family='sans-serif'%3EO%3C/text%3E%3C/svg%3E">
<title>OneFeed · 插件化多平台信息流（离线演示）</title>
<style>
  :root{
    --ink:#141414; --muted:#7b7b7b; --faint:#a8a8a8; --line:#ebebe8; --line2:#f4f4f1;
    --bg:#ffffff; --soft:#fafaf8; --chip:#f3f3ef; --accent:#111;
    --bili:#00a1d6; --xhs:#ff2e4d; --dy:#fe2c55; --jj:#1e80ff; --v2:#4d4d4d; --zh:#0084ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .wrap{max-width:1400px;margin:0 auto;padding:0 32px}

  /* ---------- header ---------- */
  header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);
    backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
  .topbar{display:flex;align-items:center;gap:18px;height:66px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.2px}
  .logo .mark{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;
    display:grid;place-items:center;font-size:14px;font-weight:700}
  .logo sub{font-weight:400;color:var(--faint);font-size:11px;letter-spacing:1.6px;margin-left:2px}
  .tabs{display:flex;gap:6px;margin-left:8px}
  .tabs button{padding:7px 13px;border-radius:999px;color:var(--muted);font-size:14px}
  .tabs button.on{background:var(--chip);color:var(--ink);font-weight:600}
  .spacer{flex:1}
  .topmetas{color:var(--faint);font-size:12.5px}
  .iconbtn{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
  .iconbtn:hover{background:var(--chip);color:var(--ink)}

  /* ---------- toolbar ---------- */
  .toolbar{padding:26px 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
  .seg button{padding:6px 15px;border-radius:999px;font-size:13.5px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .platrow{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0 6px;align-items:center}
  .pchip{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;
    border:1px solid var(--line);color:#3d3d3d;font-size:13.5px;background:#fff;transition:.14s}
  .pchip .dot{width:7px;height:7px;border-radius:50%}
  .pchip .cnt{color:var(--faint);font-size:12px}
  .pchip:hover{border-color:#d8d8d2}
  .pchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pchip.on .cnt{color:rgba(255,255,255,.6)}

  .searchrow{display:flex;gap:12px;align-items:center;padding:12px 0 4px}
  .search{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);
    border-radius:12px;padding:11px 16px;background:#fff}
  .search input{border:0;outline:0;flex:1;font-size:14px;background:transparent}
  .search input::placeholder{color:var(--faint)}
  .btn-dark{background:var(--ink);color:#fff;border-radius:10px;padding:10px 20px;font-size:13.5px}

  .summary{padding:14px 0 0;color:var(--muted);font-size:13px}
  .summary b{color:var(--ink);font-weight:600}
  .hint{color:var(--faint);font-size:12px;margin-top:2px}

  /* ---------- feed grid ---------- */
  .feed{display:grid;grid-template-columns:repeat(3,1fr);gap:0 22px;padding:22px 0 90px;align-items:start}
  .feed .col{display:flex;flex-direction:column;min-width:0}
  @media (max-width:1180px){.feed{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:760px){.feed{grid-template-columns:1fr}.wrap{padding:0 18px}
    .topbar{flex-wrap:nowrap;min-width:0}
    .logo{flex:0 0 auto}
    .logo sub{display:none}
    #topmeta{display:none}
    .tabs{margin-left:4px;gap:2px;min-width:0}
    .tabs button{padding:6px 8px;font-size:13px;white-space:nowrap}
    .toolbar{gap:8px;flex-wrap:wrap}
    .seg button{font-size:13px;padding:6px 10px}}
  .card{break-inside:avoid;margin:0 0 22px;border:1px solid var(--line);border-radius:16px;
    overflow:hidden;background:#fff;transition:.16s;cursor:pointer}
  .card:hover{box-shadow:0 8px 26px rgba(0,0,0,.07);transform:translateY(-1px)}
  .thumb{position:relative;background:var(--line2);aspect-ratio:16/9;overflow:hidden}
  .thumb.wide{aspect-ratio:4/3}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ph{width:100%;height:100%;display:grid;place-items:center;color:#c9c9c2;font-size:12px;letter-spacing:2px}
  .dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.72);color:#fff;
    font-size:11.5px;padding:2px 7px;border-radius:6px;letter-spacing:.3px}
  .kbadge{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.94);color:#333;
    font-size:11px;padding:2px 8px;border-radius:6px;display:inline-flex;gap:5px;align-items:center}
  .body{padding:15px 17px 16px}
  .ctitle{font-size:16.5px;line-height:1.45;font-weight:600;letter-spacing:-.1px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ctext{margin-top:9px;color:#5c5c5c;font-size:13.5px;line-height:1.62;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
  .meta{display:flex;align-items:center;gap:8px;margin-top:13px;color:var(--faint);font-size:12.5px}
  .avatar{width:18px;height:18px;border-radius:50%;background:var(--chip);display:grid;place-items:center;
    font-size:9px;color:#777;flex:none}
  .meta .author{color:#4b4b4b;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta .grow{flex:1}
  .stat{display:inline-flex;align-items:center;gap:4px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .tag{font-size:11.5px;color:#6d6d6d;background:var(--chip);border-radius:6px;padding:2px 8px}

  /* text-only / list styles */
  .quote{padding:17px 18px 4px}
  .quote .q{color:#4d4d4d;font-size:13.5px;line-height:1.66;white-space:pre-wrap;
    display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .rank{display:flex;gap:12px;align-items:baseline;padding:16px 18px 4px}
  .rank .no{font-family:ui-monospace,Menlo,monospace;color:#c9c9c2;font-size:13px;min-width:22px}
  .rank .rt{font-size:16px;font-weight:600;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .heat{color:var(--xhs);font-size:13px;font-weight:600;white-space:nowrap}
  .hcard{display:flex;gap:14px;padding:14px 16px}
  .hcard .htxt{flex:1;min-width:0}
  .hcard .hthumb{width:96px;height:72px;border-radius:10px;overflow:hidden;background:var(--line2);flex:none}
  .hcard .hthumb img{width:100%;height:100%;object-fit:cover}

  /* ---------- drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,20,20,.22);opacity:0;pointer-events:none;
    transition:.2s;z-index:60}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,94vw);background:#fff;z-index:61;
    transform:translateX(102%);transition:transform .26s cubic-bezier(.22,.61,.36,1);
    display:flex;flex-direction:column;border-left:1px solid var(--line)}
  .drawer.on{transform:none}
  .dhead{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}
  .dhead .p{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .dhead .k{font-size:11.5px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .dbody{overflow:auto;padding:24px 26px 40px}
  .dbody h1{font-size:23px;line-height:1.42;margin:0 0 12px;letter-spacing:-.3px}
  .dmeta{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13px;margin-bottom:18px}
  .dstats{display:flex;gap:10px;margin:18px 0 22px;flex-wrap:wrap}
  .dstat{border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:88px}
  .dstat b{display:block;font-size:16px;font-weight:650}
  .dstat span{color:var(--faint);font-size:12px}
  .dcover{border-radius:14px;overflow:hidden;background:var(--line2);margin-bottom:18px}
  .dcover img{width:100%;display:block}
  .dtext{white-space:pre-wrap;color:#3f3f3f;font-size:14.5px;line-height:1.75}
  .dnote{margin-top:18px;background:var(--soft);border:1px solid var(--line);border-radius:12px;
    padding:13px 16px;color:var(--muted);font-size:12.5px;line-height:1.7}
  .dactions{display:flex;gap:10px;margin-top:20px}
  .dactions .btn-dark{flex:1;text-align:center;padding:13px}
  .btn-ghost{border:1px solid var(--line);border-radius:10px;padding:13px 18px;font-size:13.5px;color:#3f3f3f}

  /* ---------- market ---------- */
  .market{padding:26px 0 90px}
  .mhead{display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .mhead h2{margin:0;font-size:22px;letter-spacing:-.3px}
  .mhead p{margin:0;color:var(--muted);font-size:13px}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-top:22px}
  @media (max-width:900px){.mgrid{grid-template-columns:1fr}}
  .pcard{border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .pcard .ph{display:flex;align-items:center;gap:10px}
  .pcard .nm{font-weight:650;font-size:16px}
  .pcard .ver{color:var(--faint);font-size:12px}
  .pcard .desc{color:#5c5c5c;font-size:13.5px;margin-top:10px;line-height:1.7}
  .pcard .feats{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .fchip{font-size:11.5px;color:#5f5f5f;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  .sw{margin-left:auto;width:38px;height:22px;border-radius:999px;background:var(--ink);position:relative}
  .sw::after{content:"";position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff}
  .sw.off{background:#ddd}
  .sw.off::after{left:2px;right:auto}
  .src{margin-top:20px;color:var(--faint);font-size:12px}

  /* ---------- about ---------- */
  .about{padding:26px 0 90px;max-width:900px}
  .about h2{font-size:22px;margin:0 0 18px;letter-spacing:-.3px}
  .about h3{font-size:15px;margin:26px 0 10px}
  .about p,.about li{color:#4a4a4a;font-size:14px;line-height:1.8}
  .about ul{padding-left:20px;margin:8px 0}
  .arch{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:14px;align-items:center;
    border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0 8px;background:var(--soft)}
  .arch .box{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px}
  .arch .box b{display:block;font-size:14px}
  .arch .box span{color:var(--faint);font-size:12px}
  .arch .arrow{color:#c9c9c2;font-size:18px}
  @media (max-width:820px){.arch{grid-template-columns:1fr}.arch .arrow{display:none}}
  .kv{color:#4a4a4a;font-size:13.5px;line-height:1.9}
  .foot{padding:26px 0 60px;color:var(--faint);font-size:12px;border-top:1px solid var(--line);margin-top:40px}
  .empty{text-align:center;padding:80px 0;color:var(--muted)}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:var(--ink);
    color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;opacity:0;transition:.22s;z-index:80}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap topbar">
    <div class="logo"><span class="mark">O</span>OneFeed<sub>FEED · 7 SOURCES</sub></div>
    <nav class="tabs" id="tabs">
      <button data-tab="feed" class="on">信息流</button>
      <button data-tab="market">插件市场</button>
      <button data-tab="about">架构说明</button>
    </nav>
    <div class="spacer"></div>
    <div class="topmetas" id="topmeta"></div>
    <button class="iconbtn" id="refresh" title="刷新">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>

<main id="viewFeed">
  <div class="wrap">
    <div class="toolbar">
      <div class="seg" id="sortseg">
        <button data-sort="new" class="on">按新鲜度</button>
        <button data-sort="hot">按热度</button>
      </div>
      <div class="seg" id="timeseg">
        <button data-time="today">今天</button>
        <button data-time="all" class="on">全部时间</button>
      </div>
    </div>
    <div class="platrow" id="platrow"></div>
    <div class="searchrow">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a8a8" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="用一句话筛，比如「只看 B 站的 AI」">
      </label>
      <button class="btn-dark" id="filterBtn">筛选</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="wrap"><div class="feed" id="feed"></div></div>
</main>

<section class="market wrap" id="viewMarket" style="display:none"></section>
<section class="about wrap" id="viewAbout" style="display:none"></section>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dhead">
    <span class="p" id="dplat"></span>
    <span class="k" id="dkind"></span>
    <div class="spacer"></div>
    <button class="iconbtn" id="dclose">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const PLAT = {
  bilibili:{name:"B站", color:"#00a1d6", short:"B"},
  douyin:{name:"抖音", color:"#fe2c55", short:"抖"},
  xiaohongshu:{name:"小红书", color:"#ff2e4d", short:"红"},
  zhihu:{name:"知乎", color:"#0084ff", short:"知"},
  juejin:{name:"掘金", color:"#1e80ff", short:"掘"},
  v2ex:{name:"V2EX", color:"#4d4d4d", short:"V"},
  "zhihu-hot":{name:"知乎热榜", color:"#0084ff", short:"榜"}
};
const KIND = {video:"视频", images:"图文", article:"文章", short:"动态", list:"榜单"};
const items = (window.SNAPSHOT && window.SNAPSHOT.items) || [];
const state = {plat:"all", sort:"new", time:"all", q:""};

/* ---------- helpers ---------- */
const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function num(n){ if(n==null||n===0) return ""; if(n>=100000000) return (n/100000000).toFixed(1).replace(/\.0$/,"")+"亿";
  if(n>=10000) return (n/10000).toFixed(1).replace(/\.0$/,"")+"万";
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,"")+"k"; return String(n); }
function dur(s){ if(!s) return ""; s=Math.round(s); const m=Math.floor(s/60), ss=s%60;
  return (m>=60? Math.floor(m/60)+":"+String(m%60).padStart(2,"0") : m)+":"+String(ss).padStart(2,"0"); }
function rel(ts){ if(!ts) return ""; const t = ts>1e12? ts/1000 : ts; const d=Date.now()/1000 - t;
  if(d<60) return "刚刚"; if(d<3600) return Math.max(1,Math.floor(d/60))+" 分钟前";
  if(d<86400) return Math.floor(d/3600)+" 小时前"; if(d<86400*30) return Math.floor(d/86400)+" 天前";
  const dt = new Date(t*1000); return (dt.getMonth()+1)+"-"+String(dt.getDate()).padStart(2,"0"); }
function relDay(ts){ if(!ts) return ""; const dt = new Date((ts>1e12?ts:ts*1000)); const now=new Date();
  const same = dt.toDateString()===now.toDateString(); return same? "今天" : (dt.getMonth()+1)+"-"+String(dt.getDate()).padStart(2,"0"); }
function isToday(ts){ if(!ts) return false; const t=ts>1e12?ts/1000:ts; return (Date.now()/1000 - t) < 86400*1.2; }
function when(it){ return it.publishedAt ? rel(it.publishedAt) : "时间未知"; }
function heat(it){ return (it.stats&&it.stats.like||0)*3 + (it.stats&&it.stats.comment||0)*2 + (it.stats&&it.stats.view||0)/100; }

/* ---------- toolbar ---------- */
const counts = {};
items.forEach(it=>counts[it.platform]=(counts[it.platform]||0)+1);
function renderPlats(){
  const row = $("#platrow");
  const total = items.filter(passTime).length;
  row.innerHTML = '<button class="pchip on" data-p="all">全部 <span class="cnt">'+total+'</span></button>' +
    Object.keys(PLAT).filter(k=>counts[k]).map(k=>
      '<button class="pchip" data-p="'+k+'"><span class="dot" style="background:'+PLAT[k].color+'"></span>'+
      PLAT[k].name+' <span class="cnt">'+counts[k]+'</span></button>').join("");
  row.querySelectorAll(".pchip").forEach(b=>b.onclick=()=>{ state.plat=b.dataset.p; renderPlats(); render(); });
  [...row.children].forEach(b=>b.classList.toggle("on", b.dataset.p===state.plat));
}
function passTime(it){ return state.time==="all" || isToday(it.publishedAt); }
function passPlat(it){ return state.plat==="all" || it.platform===state.plat; }
function passQ(it){ if(!state.q) return true; const q=state.q.toLowerCase();
  return (it.title||"").toLowerCase().includes(q) || (it.text||"").toLowerCase().includes(q)
    || (it.author||"").toLowerCase().includes(q) || (it.tags||[]).some(t=>String(t).toLowerCase().includes(q)); }

/* ---------- card renderers ---------- */
function cardVideo(it){
  const p=PLAT[it.platform];
  return '<div class="card" data-id="'+esc(it.id)+'">'+
    (it.cover? '<div class="thumb"><img loading="lazy" src="'+esc(it.cover)+'" alt=""><span class="kbadge"><span class="dot" style="background:'+p.color+';width:6px;height:6px;border-radius:50%;display:inline-block"></span>'+p.name+' · '+KIND[it.kind]+'</span>'+
      (it.duration? '<span class="dur">'+dur(it.duration)+'</span>':'')+'</div>'
     : '<div class="thumb"><div class="ph">'+p.name+'</div></div>')+
    '<div class="body"><div class="ctitle">'+esc(it.title)+'</div>'+
    (it.text? '<div class="ctext">'+esc(it.text)+'</div>':'')+
    metaRow(it)+'</div></div>';
}
function metaRow(it){
  const p=PLAT[it.platform];
  const s=it.stats||{};
  return '<div class="meta"><span class="avatar">'+p.short+'</span>'+
    '<span class="author">'+esc(it.author||p.name)+'</span><span>·</span>'+
    '<span>'+when(it)+'</span><div class="grow"></div>'+
    (s.like? '<span class="stat">♡ '+num(s.like)+'</span>':'')+
    (s.comment? '<span class="stat">'+num(s.comment)+' 评论</span>':'')+'</div>';
}
function cardImages(it){
  const p=PLAT[it.platform];
  return '<div class="card" data-id="'+esc(it.id)+'">'+
    (it.cover? '<div class="thumb wide"><img loading="lazy" src="'+esc(it.cover)+'" alt=""><span class="kbadge"><span class="dot" style="background:'+p.color+';width:6px;height:6px;border-radius:50%;display:inline-block"></span>'+p.name+' · 图文</span></div>':'')+
    '<div class="body"><div class="ctitle">'+esc(it.title)+'</div>'+
    (it.text? '<div class="ctext">'+esc(it.text)+'</div>':'')+
    metaRow(it)+'</div></div>';
}
function cardArticle(it){
  const p=PLAT[it.platform];
  return '<div class="card" data-id="'+esc(it.id)+'"><div class="hcard">'+
    '<div class="htxt"><div class="ctitle" style="font-size:16px">'+esc(it.title)+'</div>'+
    (it.text? '<div class="ctext" style="-webkit-line-clamp:2;margin-top:8px">'+esc(it.text)+'</div>':'')+
    metaRow(it)+'</div>'+
    (it.cover? '<div class="hthumb"><img loading="lazy" src="'+esc(it.cover)+'" alt=""></div>':'')+
    '</div></div>';
}
function cardShort(it){
  return '<div class="card" data-id="'+esc(it.id)+'"><div class="quote">'+
    '<div class="q">'+esc(it.text||it.title)+'</div></div>'+
    '<div class="body" style="padding-top:12px"><div class="ctitle">'+esc(it.title)+'</div>'+metaRow(it)+'</div></div>';
}
function cardList(it,idx){
  return '<div class="card" data-id="'+esc(it.id)+'"><div class="rank">'+
    '<span class="no">'+String(idx+1).padStart(2,"0")+'</span>'+
    '<div style="flex:1"><div class="rt">'+esc(it.title)+'</div>'+
    '<div class="meta" style="margin-top:10px"><span class="dot" style="background:'+PLAT[it.platform].color+';width:6px;height:6px;border-radius:50%;display:inline-block"></span>'+
    '<span>'+PLAT[it.platform].name+'</span><span>·</span><span>热搜榜</span><div class="grow"></div>'+
    '<span class="heat">'+ (it.stats && it.stats.view? num(it.stats.view)+' 热度' : '') +'</span></div></div></div></div>';
}
function render(){
  let list = items.filter(it=>passTime(it)&&passPlat(it)&&passQ(it));
  list.sort((a,b)=> state.sort==="hot" ? heat(b)-heat(a) : (b.publishedAt||0)-(a.publishedAt||0));
  const feed = $("#feed");
  if(!list.length){
    feed.innerHTML = '<div class="empty" style="column-span:all"><b>这里还没有内容</b>当前筛选下没有匹配，换个条件试试。</div>';
  } else {
    const ncol = window.innerWidth<=760 ? 1 : (window.innerWidth<=1180 ? 2 : 3);
    const cols = Array.from({length:ncol},()=>[]);
    const heights = new Array(ncol).fill(0);
    const rankCount = {};
    list.forEach(it=>{
      let html, est;
      if(it.kind==="list"){ rankCount[it.platform]=(rankCount[it.platform]||0); html = cardList(it, rankCount[it.platform]++); est = 118; }
      else if(it.kind==="short"){ html = cardShort(it); est = 210; }
      else if(it.kind==="article"){ html = cardArticle(it); est = 180; }
      else if(it.kind==="images"){ html = cardImages(it); est = 470; }
      else { html = cardVideo(it); est = 430; }
      const i = heights.indexOf(Math.min.apply(null,heights));
      cols[i].push(html); heights[i] += est;
    });
    feed.innerHTML = cols.map(c=>'<div class="col">'+c.join("")+'</div>').join("");
  }
  feed.querySelectorAll(".card").forEach(c=>c.onclick=()=>openItem(c.dataset.id));

  const byPlat = {};
  list.forEach(it=>byPlat[it.platform]=(byPlat[it.platform]||0)+1);
  const top = Object.entries(byPlat).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([k,v])=>PLAT[k].name+" "+v+" 条").join("、");
  $("#summary").innerHTML = (state.time==="all"?"库里共":"今天一共")+
    ' <b>'+list.length+'</b> 条；主要来自 '+ (top||"——") +'。';
  $("#hint").textContent = state.plat==="all"
    ? "离线快照：每个平台各 9 条真实样本，共 " + items.length + " 条；点卡片看详情，详情页保留原平台入口。"
    : "当前只看 " + PLAT[state.plat].name + "，合计 " + list.length + " 条。";
  $("#topmeta").textContent = items.length + " 条 · 离线演示快照（7 平台）";
}

/* ---------- drawer ---------- */
let current = null;
function openItem(id){
  const it = items.find(x=>x.id===id); if(!it) return;
  current = it;
  const p = PLAT[it.platform];
  $("#dplat").innerHTML = '<span class="dot" style="background:'+p.color+';width:7px;height:7px;border-radius:50%;display:inline-block"></span>'+p.name;
  $("#dkind").textContent = KIND[it.kind]||it.kind;
  const s = it.stats||{};
  const statHtml = [["like","点赞"],["comment","评论"],["view", it.platform==="zhihu-hot"?"热度":"播放"],["share","分享"]]
    .filter(([k])=>s[k]).map(([k,label])=>'<div class="dstat"><b>'+num(s[k])+'</b><span>'+label+'</span></div>').join("");
  $("#dbody").innerHTML =
    '<h1>'+esc(it.title)+'</h1>'+
    '<div class="dmeta"><span>'+esc(it.author||p.name)+'</span><span>·</span><span>'+when(it)+'</span>'+
      (it.duration? '<span>·</span><span>'+dur(it.duration)+'</span>':'')+'</div>'+
    (statHtml? '<div class="dstats">'+statHtml+'</div>':'')+
    (it.cover? '<div class="dcover"><img src="'+esc(it.cover)+'" alt=""></div>':'')+
    (it.text? '<div class="dtext">'+esc(it.text)+'</div>':'<div class="dtext" style="color:#a8a8a8">这条在快照里没有正文，点下方「去原平台看」。</div>')+
    ((it.tags&&it.tags.length)? '<div class="tags" style="margin-top:16px">'+it.tags.slice(0,8).map(t=>'<span class="tag">#'+esc(t)+'</span>').join("")+'</div>':'')+
    '<div class="dnote">这条由 <b>'+p.name+'</b> 插件拉取，宿主只负责渲染。真实版本里，评论区由插件按能力声明提供；插件拿不到你的明文 cookie，登录态只在宿主侧注入。</div>'+
    '<div class="dactions"><a class="btn-dark" href="'+esc(it.url)+'" target="_blank" rel="noreferrer">去'+p.name+'看原帖 ↗</a>'+
      '<button class="btn-ghost" id="copyBtn">复制链接</button></div>';
  $("#copyBtn").onclick = ()=>{ navigator.clipboard && navigator.clipboard.writeText(it.url); toast("链接已复制"); };
  $("#scrim").classList.add("on"); $("#drawer").classList.add("on");
}
function closeDrawer(){ $("#scrim").classList.remove("on"); $("#drawer").classList.remove("on"); }
$("#scrim").onclick = closeDrawer; $("#dclose").onclick = closeDrawer;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeDrawer(); });

/* ---------- toast ---------- */
let tt;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),1800); }

/* ---------- market ---------- */

  {id:"xiaohongshu", name:"小红书", ver:"v0.4.1", desc:"小红书发现页与关注流（只读，宿主浏览器截 homefeed；登录态由宿主注入 cookie）。", feats:["图文","视频","评论","关注","browser"]},

function renderMarket(){
  $("#viewMarket").innerHTML =
    '<div class="mhead"><div><h2>插件市场</h2><p>宿主里没有任何平台代码。装一个插件，多一路来源；卸掉它，宿主还是那个宿主。</p></div>'+
    '<div class="spacer"></div><button class="btn-dark" id="mRefresh">刷新目录</button></div>'+
    '<div class="mgrid">'+PLUGINS.map(p=>{
      const c = PLAT[p.id]? PLAT[p.id].color : "#111";

/* ---------- about ---------- */

/* ---------- wiring ---------- */
$("#tabs").onclick = (e)=>{
  const b = e.target.closest("button"); if(!b) return;
  [...$("#tabs").children].forEach(x=>x.classList.toggle("on", x===b));
  const t = b.dataset.tab;
  $("#viewFeed").style.display = t==="feed"?"block":"none";
  $("#viewMarket").style.display = t==="market"?"block":"none";
  $("#viewAbout").style.display = t==="about"?"block":"none";
  if(t==="market") renderMarket();
  if(t==="about") renderAbout();
};
$("#sortseg").onclick = (e)=>{ const b=e.target.closest("button"); if(!b)return;
  state.sort=b.dataset.sort; [...$("#sortseg").children].forEach(x=>x.classList.toggle("on",x===b)); render(); };
$("#timeseg").onclick = (e)=>{ const b=e.target.closest("button"); if(!b)return;
  state.time=b.dataset.time; [...$("#timeseg").children].forEach(x=>x.classList.toggle("on",x===b)); renderPlats(); render(); };
$("#filterBtn").onclick = ()=>{ state.q=$("#q").value.trim(); render(); if(state.q) toast("筛选中：" + state.q); };
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter"){ state.q=$("#q").value.trim(); render(); } });
$("#refresh").onclick = ()=>{ toast("这是静态快照；真实版本会重新采集 7 个平台"); };

renderPlats(); render(); renderMarket(); renderAbout();
</script>
