name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: 装依赖
        run: uv sync --frozen
      - name: 跑离线测试（联网用例要真去抓平台，CI 里跳过）
        run: uv run python tests/run_all.py --offline

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 装前端依赖
        run: npm ci
        working-directory: web
      - name: 构建
        run: npm run build
        working-directory: web
